spring.application.name=backend
server.port=8082

# PostgreSQL
spring.datasource.url=${SIGNALDESK_DB_URL:jdbc:postgresql://127.0.0.1:5433/signaldesk}
spring.datasource.username=${SIGNALDESK_DB_USERNAME:signaldesk_appln}
spring.datasource.password=${SIGNALDESK_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway migration management

spring.jpa.open-in-view=false

